<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù</title>
<meta name="description" content="Menù digitale del locale, sempre aggiornato.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<meta name="theme-color" content="#7a1f2b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="RenMenu">
<meta name="format-detection" content="telephone=yes">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="canonical" href="https://rua56.github.io/renmenu/menu/index.html">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
  html { scroll-padding-top: 132px; }
  body { background: var(--color-bg); }
  .top { position: sticky; top: 0; z-index: 40; background: var(--color-bg); background: color-mix(in oklab, var(--color-bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--color-divider); }
  .top__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; }
  .top__name { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top__actions { display: flex; gap: var(--space-1); align-items: center; flex: none; }
  .lang { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-full); overflow: hidden; background: var(--color-surface); }
  .lang button { padding: var(--space-1) var(--space-3); font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); min-height: 32px; }
  .lang button[aria-pressed='true'] { background: var(--color-text); color: var(--color-text-inverse); }
  .chips { display: flex; gap: var(--space-2); overflow-x: auto; padding: 0 0 var(--space-3); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted); text-decoration: none; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; }
  .chip[aria-current='true'] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-text-inverse); }

  .hero { padding: var(--space-8) 0 var(--space-4); }
  .hero h1 { font-size: var(--text-2xl); font-weight: 500; }
  .hero p { color: var(--color-text-muted); margin-top: var(--space-2); font-size: var(--text-sm); }
  .avviso { display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-5); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-primary-highlight); color: var(--color-text); border-left: 3px solid var(--color-primary); font-size: var(--text-sm); }
  .avviso b { font-family: var(--font-display); font-weight: 600; color: var(--color-primary); }
  .search { margin-top: var(--space-5); position: relative; }
  .search input { width: 100%; padding: var(--space-3) var(--space-4) var(--space-3) var(--space-10); border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); min-height: 44px; }
  .search input:focus { border-color: var(--color-primary); outline: none; box-shadow: 0 0 0 3px var(--color-primary-highlight); }
  .search svg { position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--color-text-faint); }

  .sezione { padding: var(--space-6) 0 var(--space-2); }
  .sezione__head { display: flex; flex-direction: column; gap: var(--space-1); border-bottom: 1px solid var(--color-text); padding-bottom: var(--space-3); margin-bottom: var(--space-2); }
  .sezione h2 { font-size: var(--text-xl); font-weight: 500; }
  .sezione__desc { font-size: var(--text-sm); color: var(--color-text-muted); max-width: 60ch; }
  .voce { display: grid; grid-template-columns: 1fr auto; column-gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px dashed var(--color-divider); }
  .voce:last-child { border-bottom: 0; }
  .voce__nome { font-weight: 600; font-size: var(--text-base); line-height: 1.3; }
  .voce__desc { color: var(--color-text-muted); font-size: var(--text-sm); margin-top: var(--space-1); }
  .voce__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); align-items: center; }
  .tag { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: var(--radius-full); background: var(--color-surface-offset); color: var(--color-text-muted); font-weight: 500; }
  .tag--top { background: var(--color-primary-highlight); color: var(--color-primary); }
  .all { font-size: var(--text-xs); color: var(--color-text-faint); letter-spacing: 0.04em; }
  .voce__prezzo { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .voce__prezzo small { font-size: var(--text-xs); color: var(--color-text-muted); font-family: var(--font-body); margin-left: 2px; }
  .empty { text-align: center; color: var(--color-text-muted); padding: var(--space-12) 0; font-size: var(--text-sm); }

  .info { margin-top: var(--space-10); padding: var(--space-6) 0 var(--space-12); border-top: 1px solid var(--color-divider); font-size: var(--text-sm); color: var(--color-text-muted); }
  .info h3 { font-size: var(--text-lg); color: var(--color-text); margin-bottom: var(--space-3); }
  .info__grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .info a { color: var(--color-primary); text-decoration: none; font-weight: 600; }
  .legenda { margin-top: var(--space-6); display: grid; gap: var(--space-1) var(--space-4); grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); font-size: var(--text-xs); }
  .legenda b { color: var(--color-text); font-weight: 600; margin-right: 4px; }
  .coperto { margin-top: var(--space-4); font-size: var(--text-xs); }
  .powered { text-align: center; padding: var(--space-6) 0 calc(var(--space-8) + env(safe-area-inset-bottom)); font-size: var(--text-xs); color: var(--color-text-faint); }
  .powered a { color: var(--color-text-muted); text-decoration: none; font-weight: 600; }
  .error { padding: var(--space-16) var(--space-5); text-align: center; }
  .error h1 { font-size: var(--text-xl); margin-bottom: var(--space-3); }
  .skeleton { height: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--color-surface-offset) 25%, var(--color-surface-offset-2) 50%, var(--color-surface-offset) 75%); background-size: 200% 100%; animation: sk 1.4s infinite; margin: var(--space-3) 0; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (min-width: 720px) { .hero { padding-top: var(--space-12); } .voce { padding: var(--space-5) 0; } }
</style>
</head>
<body>
<header class="top">
  <div class="container">
    <div class="top__row">
      <div class="top__name" id="topName">&nbsp;</div>
      <div class="top__actions">
        <div class="lang" id="lang" role="group" aria-label="Lingua"></div>
        <button class="theme-toggle" data-theme-toggle type="button"></button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Sezioni del menù"></nav>
  </div>
</header>

<main class="container" id="app" aria-live="polite">
  <div class="hero"><div class="skeleton" style="width:60%;height:34px"></div><div class="skeleton" style="width:40%"></div></div>
  <div class="skeleton"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:90%"></div>
</main>

<footer class="powered"><span data-powered>Menù digitale realizzato con </span><a href="../index.html" data-brand-name>RenMenu</a></footer>

<script src="../assets/common.js"></script>
<script>
(async function () {
  const R = window.RENMENU;
  const params = new URLSearchParams(location.search);
  const hash = location.hash.startsWith('#data=') ? location.hash.slice(6) : null;
  const id = params.get('m') || 'bakaro';
  let lang = (params.get('lang') || (navigator.language || 'it').slice(0, 2)).toLowerCase();
  let menu;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = v => (v == null ? '' : typeof v === 'string' ? v : (v[lang] || v.it || Object.values(v)[0] || ''));

  try {
    if (hash) {
      menu = JSON.parse(decodeURIComponent(escape(atob(hash.replace(/-/g, '+').replace(/_/g, '/')))));
    } else {
      const res = await fetch(`../menus/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
      if (!res.ok) throw new Error('not found');
      menu = await res.json();
    }
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error"><h1>Menù non trovato</h1><p class="muted">Controlla il QR code o chiedi al personale.</p></div>`;
    return;
  }

  const langs = menu.lingue || ['it', 'en'];
  if (!langs.includes(lang)) lang = langs[0];
  document.title = `${menu.nome} — Menù`;
  document.documentElement.lang = lang;

  const L = {
    it: { powered: 'Menù digitale realizzato con', cerca: 'Cerca un piatto…', nessuno: 'Nessun piatto trovato.', info: 'Informazioni', allergeni: 'Allergeni', coperto: 'Coperto', mappa: 'Apri in Google Maps', chiama: 'Chiama', oggi: 'Oggi' },
    en: { powered: 'Digital menu made with', cerca: 'Search a dish…', nessuno: 'No dishes found.', info: 'Info', allergeni: 'Allergens', coperto: 'Cover charge', mappa: 'Open in Google Maps', chiama: 'Call', oggi: 'Today' },
    de: { powered: 'Digitale Speisekarte erstellt mit', cerca: 'Gericht suchen…', nessuno: 'Keine Gerichte gefunden.', info: 'Info', allergeni: 'Allergene', coperto: 'Gedeck', mappa: 'In Google Maps öffnen', chiama: 'Anrufen', oggi: 'Heute' },
    fr: { powered: 'Menu numérique réalisé avec', cerca: 'Rechercher un plat…', nessuno: 'Aucun plat trouvé.', info: 'Infos', allergeni: 'Allergènes', coperto: 'Couvert', mappa: 'Ouvrir dans Google Maps', chiama: 'Appeler', oggi: "Aujourd'hui" },
    es: { powered: 'Menú digital creado con', cerca: 'Buscar un plato…', nessuno: 'No se encontraron platos.', info: 'Información', allergeni: 'Alérgenos', coperto: 'Cubierto', mappa: 'Abrir en Google Maps', chiama: 'Llamar', oggi: 'Hoy' }
  };
  const S = () => L[lang] || L.it;
  document.querySelector('[data-powered]').textContent = S().powered + ' ';

  function render(query = '') {
    const q = query.trim().toLowerCase();
    const slug = (s, i) => 'sez-' + i;
    document.getElementById('topName').textContent = menu.nome;

    // language switch
    document.getElementById('lang').innerHTML = langs.map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}">${l}</button>`).join('');
    document.getElementById('lang').querySelectorAll('button').forEach(b => b.onclick = () => { lang = b.dataset.lang; document.documentElement.lang = lang; render(document.getElementById('q')?.value || ''); });

    // chips (scroll via JS so the #data= hash, if present, is preserved)
    document.getElementById('chips').innerHTML = menu.sezioni.map((s, i) => `<a class="chip" href="#${slug(s, i)}" data-i="${i}">${esc(t(s.nome))}</a>`).join('');
    document.getElementById('chips').querySelectorAll('.chip').forEach(c => c.addEventListener('click', e => { e.preventDefault(); const el = document.getElementById(c.getAttribute('href').slice(1)); if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 128; window.scrollTo({ top: y, behavior: 'smooth' }); } }));

    let html = `<section class="hero">
      <h1>${esc(menu.nome)}</h1>
      ${menu.sottotitolo ? `<p>${esc(t(menu.sottotitolo))}</p>` : ''}
      ${menu.avviso && t(menu.avviso) ? `<div class="avviso"><b>${S().oggi}</b><span>${esc(t(menu.avviso)).replace(/^Oggi:\s*|^Today:\s*/i, '')}</span></div>` : ''}
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="${S().cerca}" value="${esc(query)}" autocomplete="off" aria-label="${S().cerca}"></div>
    </section>`;

    let total = 0;
    menu.sezioni.forEach((s, i) => {
      const voci = (s.voci || []).filter(v => !q || (t(v.nome) + ' ' + t(v.descrizione)).toLowerCase().includes(q));
      if (!voci.length) return;
      total += voci.length;
      html += `<section class="sezione" id="${slug(s, i)}"><div class="sezione__head"><h2>${esc(t(s.nome))}</h2>${s.descrizione && t(s.descrizione) ? `<span class="sezione__desc">${esc(t(s.descrizione))}</span>` : ''}</div>`;
      html += voci.map(v => {
        const tags = (v.tag || []).map(k => R.tags[k] ? `<span class="tag ${k === 'top' ? 'tag--top' : ''}">${R.tags[k].icon} ${esc(R.tags[k][lang] || R.tags[k].it)}</span>` : '').join('');
        const all = (v.allergeni || []).length ? `<span class="all" title="${S().allergeni}">${S().allergeni}: ${v.allergeni.join(' · ')}</span>` : '';
        const prezzo = v.prezzo ? `€ ${esc(v.prezzo)}` : '';
        return `<article class="voce"><div><div class="voce__nome">${esc(t(v.nome))}</div>${v.descrizione && t(v.descrizione) ? `<p class="voce__desc">${esc(t(v.descrizione))}</p>` : ''}${(tags || all) ? `<div class="voce__meta">${tags}${all}</div>` : ''}</div><div class="voce__prezzo">${prezzo}${v.unita ? `<small>${esc(v.unita)}</small>` : ''}</div></article>`;
      }).join('');
      html += `</section>`;
    });
    if (!total) html += `<p class="empty">${S().nessuno}</p>`;

    // info
    const usedAll = new Set(menu.sezioni.flatMap(s => (s.voci || []).flatMap(v => v.allergeni || [])));
    html += `<section class="info"><h3>${S().info}</h3><div class="info__grid">
      ${menu.indirizzo ? `<div>${esc(menu.indirizzo)}${menu.maps ? `<br><a href="${esc(menu.maps)}" target="_blank" rel="noopener">${S().mappa} →</a>` : ''}</div>` : ''}
      ${menu.orari ? `<div>${esc(t(menu.orari))}</div>` : ''}
      ${menu.telefono ? `<div><a href="tel:${esc(menu.telefono.replace(/\s/g, ''))}">${S().chiama} ${esc(menu.telefono)}</a></div>` : ''}
      ${menu.instagram ? `<div><a href="https://instagram.com/${esc(menu.instagram)}" target="_blank" rel="noopener">@${esc(menu.instagram)}</a></div>` : ''}
      ${menu.wifi ? `<div>Wi-Fi: ${esc(menu.wifi)}</div>` : ''}
    </div>
    ${menu.coperto ? `<p class="coperto">${S().coperto}: € ${esc(menu.coperto)}</p>` : ''}
    ${usedAll.size ? `<div class="legenda">${[...usedAll].sort((a, b) => a - b).map(k => R.allergeni[k] ? `<span><b>${k}</b>${esc(R.allergeni[k][lang] || R.allergeni[k].it)}</span>` : '').join('')}</div>` : ''}
    ${menu.note && t(menu.note) ? `<p class="coperto">${esc(t(menu.note))}</p>` : ''}
    </section>`;

    document.getElementById('app').innerHTML = html;
    const qEl = document.getElementById('q');
    qEl.addEventListener('input', () => { const pos = qEl.selectionStart; render(qEl.value); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
    observe();
  }

  let io;
  function observe() {
    if (io) io.disconnect();
    const chips = [...document.querySelectorAll('.chip')];
    const secs = [...document.querySelectorAll('.sezione')];
    if (!secs.length) return;
    io = new IntersectionObserver(entries => {
      const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (!vis) return;
      const i = vis.target.id.replace('sez-', '');
      chips.forEach(c => c.setAttribute('aria-current', c.dataset.i === i));
      const active = chips.find(c => c.dataset.i === i);
      if (active) { const nav = active.parentElement; nav.scrollTo({ left: active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2, behavior: 'smooth' }); }
    }, { rootMargin: '-120px 0px -60% 0px' });
    secs.forEach(s => io.observe(s));
  }

  render();
})();
</script>
</body>
</html>
