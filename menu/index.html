<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù</title>
<meta name="description" content="Menù digitale del locale, sempre aggiornato.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<meta name="theme-color" content="#7a1f2b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="RenMenu">
<meta name="format-detection" content="telephone=yes">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="canonical" href="https://renmenu.pages.dev/menu/">
<link rel="icon" href="../assets/favicon.png" type="image/png">
<style>
  /* Temi Standard: ogni locale sceglie una palette (campo "tema" del menu). */
  :root, [data-tema='bordeaux'] { --m-accent: #7a1f2b; --m-accent-2: #a8323f; --m-second: #6f8a5a; --m-hero-a: #7a1f2b; --m-hero-b: #3f0f17; --m-gold: #e8c27a; }
  [data-tema='trattoria'] { --m-accent: #3d6b3a; --m-accent-2: #558a4f; --m-second: #b9772f; --m-hero-a: #3d6b3a; --m-hero-b: #1f3a1d; --m-gold: #f1d48a; }
  [data-tema='mare'] { --m-accent: #1d5a7a; --m-accent-2: #2b7aa0; --m-second: #c99a4a; --m-hero-a: #1d5a7a; --m-hero-b: #0d2c40; --m-gold: #f2d59a; }
  [data-tema='terracotta'] { --m-accent: #b0522b; --m-accent-2: #cc6a3f; --m-second: #5e7b6a; --m-hero-a: #b0522b; --m-hero-b: #6b2c12; --m-gold: #f6d6a8; }
  [data-tema='notte'] { --m-accent: #8c6a2c; --m-accent-2: #b08a3e; --m-second: #6a6f7a; --m-hero-a: #2a2420; --m-hero-b: #0f0d0b; --m-gold: #d8b56a; }
  [data-tema='sole'] { --m-accent: #9a6512; --m-accent-2: #c3841f; --m-second: #3f7a8a; --m-hero-a: #c9891f; --m-hero-b: #7a4a0c; --m-gold: #fff1c9; }
  [data-theme='dark'] { --m-accent: var(--m-gold); --m-accent-2: var(--m-gold); }
  :root { --m-ink-on: #fffaf2; --m-shadow: 0 1px 2px rgba(42,33,25,.05), 0 6px 18px -10px rgba(42,33,25,.22); }

  html { scroll-padding-top: 132px; }
  body { background: var(--color-bg); }
  .top { position: sticky; top: 0; z-index: 40; background: var(--color-bg); background: color-mix(in oklab, var(--color-bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--color-divider); }
  .top__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; }
  .top__name { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(4px); transition: opacity .25s ease, transform .25s ease; }
  .top.scrolled .top__name { opacity: 1; transform: none; }
  .top__actions { display: flex; gap: var(--space-1); align-items: center; flex: none; margin-left: auto; }
  .lang { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-full); overflow: hidden; background: var(--color-surface); }
  .lang button { padding: var(--space-1) var(--space-3); font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); min-height: 32px; }
  .lang button[aria-pressed='true'] { background: var(--m-accent); color: var(--m-ink-on); }
  [data-theme='dark'] .lang button[aria-pressed='true'] { color: #1a140f; }
  .chips { display: flex; gap: var(--space-2); overflow-x: auto; padding: 0 0 var(--space-3); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted); text-decoration: none; transition: background var(--transition-interactive), color var(--transition-interactive), border-color var(--transition-interactive); }
  .chip svg { width: 15px; height: 15px; opacity: .8; }
  .chip[aria-current='true'] { background: var(--m-accent); border-color: var(--m-accent); color: var(--m-ink-on); }
  [data-theme='dark'] .chip[aria-current='true'] { color: #1a140f; }

  /* Copertina */
  .hero { position: relative; overflow: hidden; margin: var(--space-5) 0 var(--space-4); padding: var(--space-8) var(--space-6) var(--space-6); border-radius: var(--radius-xl); color: var(--m-ink-on);
    background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.14), transparent 55%), linear-gradient(150deg, var(--m-hero-a), var(--m-hero-b)); box-shadow: 0 18px 40px -24px var(--m-hero-b); }
  .hero::after { content: ''; position: absolute; inset: auto -40px -60px auto; width: 190px; height: 190px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 0 0 18px rgba(255,255,255,.04), 0 0 0 40px rgba(255,255,255,.03); pointer-events: none; }
  .hero__eyebrow { font-size: var(--text-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--m-gold); font-weight: 600; }
  .hero h1 { font-size: var(--text-2xl); font-weight: 500; line-height: 1.05; margin-top: var(--space-2); color: #fff; }
  .hero p { color: rgba(255,250,242,.82); margin-top: var(--space-2); font-size: var(--text-sm); max-width: 46ch; }
  .hero__orari { display: inline-flex; gap: 8px; align-items: center; margin-top: var(--space-4); font-size: var(--text-xs); color: rgba(255,250,242,.85); }
  .hero__orari svg { width: 15px; height: 15px; flex: none; color: var(--m-gold); }
  .hero__actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-5); }
  .hero__btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius-full); background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.26); color: #fff; font-size: var(--text-sm); font-weight: 600; text-decoration: none; transition: background var(--transition-interactive); }
  .hero__btn:hover { background: rgba(255,255,255,.24); }
  .hero__btn svg { width: 16px; height: 16px; }
  .avviso { display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-4); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--m-shadow); border-left: 4px solid var(--m-accent); color: var(--color-text); }
  .avviso b { font-family: var(--font-display); font-weight: 600; color: var(--m-accent); flex: none; }
  .search { margin-top: var(--space-4); position: relative; }
  .search input { width: 100%; padding: var(--space-3) var(--space-4) var(--space-3) var(--space-10); border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface); font-size: var(--text-sm); min-height: 46px; box-shadow: var(--m-shadow); }
  .search input:focus { border-color: var(--m-accent); outline: none; box-shadow: 0 0 0 3px color-mix(in oklab, var(--m-accent) 22%, transparent); }
  .search svg { position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--color-text-faint); }

  /* Sezioni: ogni sezione con il suo tono */
  .sezione { --tint: var(--color-surface-2); margin: var(--space-5) calc(var(--space-2) * -1) 0; padding: var(--space-5) var(--space-4) var(--space-3); border-radius: var(--radius-xl); background: var(--tint); }
  .sezione[data-tono='0'] { --tint: color-mix(in oklab, var(--m-accent) 7%, var(--color-bg)); }
  .sezione[data-tono='1'] { --tint: color-mix(in oklab, var(--m-second) 12%, var(--color-bg)); }
  .sezione[data-tono='2'] { --tint: color-mix(in oklab, var(--m-accent-2) 10%, var(--color-bg)); }
  .sezione[data-tono='3'] { --tint: color-mix(in oklab, var(--color-accent) 12%, var(--color-bg)); }
  .sezione__head { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: var(--space-3); margin-bottom: var(--space-3); }
  .sezione__icon { grid-row: span 2; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--m-accent); color: var(--m-ink-on); box-shadow: 0 6px 14px -8px var(--m-accent); }
  [data-theme='dark'] .sezione__icon { color: #1a140f; }
  .sezione__icon svg { width: 22px; height: 22px; }
  .sezione h2 { font-size: var(--text-xl); font-weight: 500; line-height: 1.1; }
  .sezione__desc { font-size: var(--text-sm); color: var(--color-text-muted); max-width: 60ch; }
  .sezione__count { font-size: var(--text-xs); color: var(--color-text-muted); letter-spacing: .04em; }
  .voci { display: grid; gap: var(--space-2); }
  .voce { display: grid; grid-template-columns: 1fr auto; column-gap: var(--space-4); align-items: start; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--m-shadow); }
  .voce--top { box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--m-accent) 45%, transparent), var(--m-shadow); }
  .voce__nome { font-weight: 600; font-size: var(--text-base); line-height: 1.3; }
  .voce__desc { color: var(--color-text-muted); font-size: var(--text-sm); margin-top: var(--space-1); }
  .voce__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); align-items: center; }
  .tag { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: var(--radius-full); background: var(--color-surface-offset); color: var(--color-text-muted); font-weight: 500; }
  .tag--top { background: var(--m-accent); color: var(--m-ink-on); font-weight: 600; }
  [data-theme='dark'] .tag--top { color: #1a140f; }
  .all { display: inline-flex; gap: 4px; align-items: center; font-size: var(--text-xs); color: var(--color-text-faint); }
  .all i { font-style: normal; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--color-text-muted); background: var(--color-surface-offset); }
  .voce__prezzo { font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; padding: 4px 12px; border-radius: var(--radius-full); color: var(--m-accent); background: color-mix(in oklab, var(--m-accent) 10%, var(--color-surface)); }
  .empty { text-align: center; color: var(--color-text-muted); padding: var(--space-12) 0; font-size: var(--text-sm); }

  /* Informazioni */
  .info { margin-top: var(--space-8); padding: var(--space-6) var(--space-5); border-radius: var(--radius-xl); background: var(--color-surface); box-shadow: var(--m-shadow); font-size: var(--text-sm); color: var(--color-text-muted); }
  .info h3 { font-size: var(--text-lg); color: var(--color-text); margin-bottom: var(--space-4); }
  .info__grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .info__row { display: flex; gap: var(--space-3); align-items: flex-start; }
  .info__row svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--m-accent); }
  .info a { color: var(--m-accent); text-decoration: none; font-weight: 600; }
  .legenda { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px dashed var(--color-divider); display: grid; gap: var(--space-2) var(--space-4); grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); font-size: var(--text-xs); }
  .legenda b { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-right: 6px; border-radius: 10px; background: var(--color-surface-offset); color: var(--color-text); font-weight: 600; font-size: 11px; }
  .coperto { margin-top: var(--space-4); font-size: var(--text-xs); }
  .powered { text-align: center; padding: var(--space-8) 0 calc(var(--space-10) + env(safe-area-inset-bottom)); font-size: var(--text-xs); color: var(--color-text-faint); }
  .powered a { color: var(--m-accent); text-decoration: none; font-weight: 600; }
  .powered::before { content: ''; display: block; width: 40px; height: 2px; margin: 0 auto var(--space-4); border-radius: 2px; background: var(--m-accent); opacity: .5; }
  .su { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--m-accent); color: var(--m-ink-on); box-shadow: 0 10px 24px -10px rgba(0,0,0,.45); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
  [data-theme='dark'] .su { color: #1a140f; }
  .su.show { opacity: 1; transform: none; pointer-events: auto; }
  .su svg { width: 20px; height: 20px; }
  .error { padding: var(--space-16) var(--space-5); text-align: center; }
  .error h1 { font-size: var(--text-xl); margin-bottom: var(--space-3); }
  .skeleton { height: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--color-surface-offset) 25%, var(--color-surface-offset-2) 50%, var(--color-surface-offset) 75%); background-size: 200% 100%; animation: sk 1.4s infinite; margin: var(--space-3) 0; }
  @keyframes sk { to { background-position: -200% 0; } }
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .top__name, .su { transition: none; } }
  @media (min-width: 720px) { .hero { padding: var(--space-12) var(--space-10) var(--space-8); } .sezione { margin-inline: 0; padding: var(--space-6); } .voci { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="container">
    <div class="top__row">
      <div class="top__name" id="topName">&nbsp;</div>
      <div class="top__actions">
        <div class="lang" id="lang" role="group" aria-label="Lingua"></div>
        <button class="theme-toggle" data-theme-toggle type="button"></button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Sezioni del menù"></nav>
  </div>
</header>

<main class="container" id="app" aria-live="polite">
  <div class="hero"><div class="skeleton" style="width:60%;height:34px"></div><div class="skeleton" style="width:40%"></div></div>
  <div class="skeleton"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:90%"></div>
</main>

<button class="su" id="su" type="button" aria-label="Torna su"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg></button>
<footer class="powered"><span data-powered>Menù digitale realizzato con </span><a href="../index.html" data-brand-name>RenMenu</a></footer>

<script src="../assets/common.js"></script>
<script>
(async function () {
  const R = window.RENMENU;
  const params = new URLSearchParams(location.search);
  const hash = location.hash.startsWith('#data=') ? location.hash.slice(6) : null;
  const id = params.get('m') || 'bakaro';
  let lang = (params.get('lang') || (navigator.language || 'it').slice(0, 2)).toLowerCase();
  let menu;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = v => (v == null ? '' : typeof v === 'string' ? v : (v[lang] || v.it || Object.values(v)[0] || ''));

  try {
    if (hash) {
      menu = JSON.parse(decodeURIComponent(escape(atob(hash.replace(/-/g, '+').replace(/_/g, '/')))));
    } else {
      const res = await fetch(`../menus/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
      if (!res.ok) throw new Error('not found');
      menu = await res.json();
    }
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error"><h1>Menù non trovato</h1><p class="muted">Controlla il QR code o chiedi al personale.</p></div>`;
    return;
  }

  // Tema di colore del locale (Standard): bordeaux se non indicato.
  const TEMI = ['bordeaux', 'trattoria', 'mare', 'terracotta', 'notte', 'sole'];
  const temaProva = params.get('tema'); // anteprima di un altro tema, es. per mostrarli a un cliente
  const tema = TEMI.includes(temaProva) ? temaProva : TEMI.includes(menu.tema) ? menu.tema : 'bordeaux';
  document.documentElement.setAttribute('data-tema', tema);
  const heroColor = getComputedStyle(document.documentElement).getPropertyValue('--m-hero-a').trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => { if (m.media.includes('light') && heroColor) m.content = heroColor; });

  // Icone delle sezioni, dedotte dal nome (in qualsiasi lingua del menu).
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICONS = {
    antipasti: svg('<path d="M4 13h16a8 8 0 0 1-16 0Z"/><path d="M8 9c0-2 2-2 2-4M12 9c0-2 2-2 2-4M16 9c0-2 2-2 2-4"/>'),
    primi: svg('<path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M7 12c1-4 3-6 5-6s4 2 5 6"/><path d="M9.5 12c.5-2 1.5-3 2.5-3s2 1 2.5 3"/>'),
    secondi: svg('<path d="M7 3v8a2 2 0 0 1-2 2v8M5 3v5M9 3v5"/><path d="M17 21V3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5"/>'),
    pesce: svg('<path d="M3 12c3-4 7-6 11-6 3 0 5 2 7 6-2 4-4 6-7 6-4 0-8-2-11-6Z"/><path d="M3 12 1 8M3 12l-2 4"/><circle cx="16" cy="11" r="1"/>'),
    pizza: svg('<path d="M12 3 3 19c6 3 12 3 18 0L12 3Z"/><circle cx="11" cy="12" r="1.2"/><circle cx="14" cy="16" r="1.2"/><circle cx="9" cy="16.5" r="1"/>'),
    contorni: svg('<path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15Z"/><path d="M5 19 13 11"/>'),
    dolci: svg('<path d="M4 20h16v-6H4Z"/><path d="M4 14c2-1 4 1 6 0s4 1 6 0 3 1 4 0"/><path d="M12 10V6M12 6c-1-1-1-2 0-3 1 1 1 2 0 3Z"/>'),
    vini: svg('<path d="M8 3h8c0 5-1 9-4 9s-4-4-4-9Z"/><path d="M12 12v8M8 21h8"/>'),
    birre: svg('<path d="M6 8h10v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1Z"/><path d="M16 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 8c0-2 1.5-3 3-3 .5-1 2-2 3.5-1.5C14 3 16 4 16 6v2"/>'),
    cocktail: svg('<path d="M4 4h16l-8 9Z"/><path d="M12 13v7M8 20h8"/><path d="M15 4l3-2"/>'),
    caffe: svg('<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/>'),
    bevande: svg('<path d="M7 4h10l-1.5 16a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1Z"/><path d="M7.5 9h9"/><path d="M14 4l2-2"/>'),
    piatto: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/>')
  };
  const iconFor = (section) => {
    const n = Object.values(typeof section.nome === 'string' ? { it: section.nome } : section.nome || {}).join(' ').toLowerCase();
    const rules = [['dolci', /dolc|dessert|torte|gelat|sweet|nachspeise|postre/], ['vini', /\bvin|wine|bollicin|prosecco|champagne|wein/], ['birre', /birr|beer|bier|cervez/], ['cocktail', /cocktail|aperitiv|spritz|amari\b|distillat|liquor|\bgin\b|\brum\b/], ['caffe', /caff|coffee|kaffee|colazion|breakfast|\bt[eè]\b|tisan/], ['bevande', /bevand|bibit|drink|getr|bebida|analcol|acqu/], ['pizza', /pizz|focacc/], ['antipasti', /antipast|cicchett|stuzzic|starter|tapas|tagliere|vorspeis|entr[ée]/], ['primi', /\bprim|pasta|risott|zupp|first|suppe|minestr/], ['secondi', /second|\bcarne|main|griglia|bistecc|hauptgericht/], ['contorni', /contorn|insalat|verdur|side|salad/], ['pesce', /pesce|\bmare\b|fish|crud|frutti di mare/]];
    const hit = rules.find(([, rx]) => rx.test(n));
    return ICONS[hit ? hit[0] : 'piatto'];
  };
  const ICON_UI = {
    tel: svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
    map: svg('<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>'),
    ig: svg('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/>'),
    clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    wifi: svg('<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".8"/>')
  };
  let revealed = false;

  const langs = menu.lingue || ['it', 'en'];
  if (!langs.includes(lang)) lang = langs[0];
  document.title = `${menu.nome} — Menù`;
  document.documentElement.lang = lang;

  const L = {
    it: { powered: 'Menù digitale realizzato con', cerca: 'Cerca un piatto…', nessuno: 'Nessun piatto trovato.', info: 'Informazioni', allergeni: 'Allergeni', coperto: 'Coperto', mappa: 'Apri in Google Maps', chiama: 'Chiama', oggi: 'Oggi', mappa2: 'Mappa', benvenuti: 'Benvenuti', piatti: 'piatti', piatto: 'piatto', su: 'Torna su' },
    en: { powered: 'Digital menu made with', cerca: 'Search a dish…', nessuno: 'No dishes found.', info: 'Info', allergeni: 'Allergens', coperto: 'Cover charge', mappa: 'Open in Google Maps', chiama: 'Call', oggi: 'Today', mappa2: 'Map', benvenuti: 'Welcome', piatti: 'dishes', piatto: 'dish', su: 'Back to top' },
    de: { powered: 'Digitale Speisekarte erstellt mit', cerca: 'Gericht suchen…', nessuno: 'Keine Gerichte gefunden.', info: 'Info', allergeni: 'Allergene', coperto: 'Gedeck', mappa: 'In Google Maps öffnen', chiama: 'Anrufen', oggi: 'Heute', mappa2: 'Karte', benvenuti: 'Willkommen', piatti: 'Gerichte', piatto: 'Gericht', su: 'Nach oben' },
    fr: { powered: 'Menu numérique réalisé avec', cerca: 'Rechercher un plat…', nessuno: 'Aucun plat trouvé.', info: 'Infos', allergeni: 'Allergènes', coperto: 'Couvert', mappa: 'Ouvrir dans Google Maps', chiama: 'Appeler', oggi: "Aujourd'hui", mappa2: 'Plan', benvenuti: 'Bienvenue', piatti: 'plats', piatto: 'plat', su: 'Haut de page' },
    es: { powered: 'Menú digital creado con', cerca: 'Buscar un plato…', nessuno: 'No se encontraron platos.', info: 'Información', allergeni: 'Alérgenos', coperto: 'Cubierto', mappa: 'Abrir en Google Maps', chiama: 'Llamar', oggi: 'Hoy', mappa2: 'Mapa', benvenuti: 'Bienvenidos', piatti: 'platos', piatto: 'plato', su: 'Volver arriba' }
  };
  const S = () => L[lang] || L.it;
  document.querySelector('[data-powered]').textContent = S().powered + ' ';

  function render(query = '') {
    const q = query.trim().toLowerCase();
    const slug = (s, i) => 'sez-' + i;
    document.getElementById('topName').textContent = menu.nome;

    // language switch
    document.getElementById('lang').innerHTML = langs.map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}">${l}</button>`).join('');
    document.getElementById('lang').querySelectorAll('button').forEach(b => b.onclick = () => { lang = b.dataset.lang; document.documentElement.lang = lang; render(document.getElementById('q')?.value || ''); });

    // chips (scroll via JS so the #data= hash, if present, is preserved)
    document.getElementById('chips').innerHTML = menu.sezioni.map((s, i) => `<a class="chip" href="#${slug(s, i)}" data-i="${i}">${iconFor(s)}${esc(t(s.nome))}</a>`).join('');
    document.getElementById('chips').querySelectorAll('.chip').forEach(c => c.addEventListener('click', e => { e.preventDefault(); const el = document.getElementById(c.getAttribute('href').slice(1)); if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 128; window.scrollTo({ top: y, behavior: 'smooth' }); } }));

    const tel = menu.telefono ? String(menu.telefono).replace(/\s/g, '') : '';
    const ig = menu.instagram ? String(menu.instagram).replace(/^@/, '') : '';
    const actions = [tel ? `<a class="hero__btn" href="tel:${esc(tel)}">${ICON_UI.tel}${S().chiama}</a>` : '', menu.maps ? `<a class="hero__btn" href="${esc(menu.maps)}" target="_blank" rel="noopener">${ICON_UI.map}${S().mappa2}</a>` : '', ig ? `<a class="hero__btn" href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">${ICON_UI.ig}Instagram</a>` : ''].join('');
    let html = `<section class="hero">
      <span class="hero__eyebrow">${S().benvenuti}</span>
      <h1>${esc(menu.nome)}</h1>
      ${menu.sottotitolo && t(menu.sottotitolo) ? `<p>${esc(t(menu.sottotitolo))}</p>` : ''}
      ${menu.orari && t(menu.orari) ? `<span class="hero__orari">${ICON_UI.clock}${esc(t(menu.orari))}</span>` : ''}
      ${actions ? `<div class="hero__actions">${actions}</div>` : ''}
    </section>
    ${menu.avviso && t(menu.avviso) ? `<div class="avviso"><b>${S().oggi}</b><span>${esc(t(menu.avviso)).replace(/^Oggi:\s*|^Today:\s*/i, '')}</span></div>` : ''}
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="${S().cerca}" value="${esc(query)}" autocomplete="off" aria-label="${S().cerca}"></div>`;

    let total = 0;
    menu.sezioni.forEach((s, i) => {
      const voci = (s.voci || []).filter(v => !q || (t(v.nome) + ' ' + t(v.descrizione)).toLowerCase().includes(q));
      if (!voci.length) return;
      total += voci.length;
      const count = `${voci.length} ${voci.length === 1 ? S().piatto : S().piatti}`;
      html += `<section class="sezione${revealed ? '' : ' reveal'}" id="${slug(s, i)}" data-tono="${i % 4}"><div class="sezione__head"><span class="sezione__icon">${iconFor(s)}</span><h2>${esc(t(s.nome))}</h2>${s.descrizione && t(s.descrizione) ? `<span class="sezione__desc">${esc(t(s.descrizione))}</span>` : `<span class="sezione__count">${count}</span>`}</div><div class="voci">`;
      html += voci.map(v => {
        const tags = (v.tag || []).map(k => R.tags[k] ? `<span class="tag ${k === 'top' ? 'tag--top' : ''}">${R.tags[k].icon} ${esc(R.tags[k][lang] || R.tags[k].it)}</span>` : '').join('');
        const all = (v.allergeni || []).length ? `<span class="all" title="${S().allergeni}">${S().allergeni} ${v.allergeni.map((k) => `<i>${esc(k)}</i>`).join('')}</span>` : '';
        const prezzo = v.prezzo ? `€ ${esc(v.prezzo)}` : '';
        return `<article class="voce${(v.tag || []).includes('top') ? ' voce--top' : ''}"><div><div class="voce__nome">${esc(t(v.nome))}</div>${v.descrizione && t(v.descrizione) ? `<p class="voce__desc">${esc(t(v.descrizione))}</p>` : ''}${(tags || all) ? `<div class="voce__meta">${tags}${all}</div>` : ''}</div>${prezzo ? `<div class="voce__prezzo">${prezzo}${v.unita ? `<small>${esc(v.unita)}</small>` : ''}</div>` : ''}</article>`;
      }).join('');
      html += `</div></section>`;
    });
    if (!total) html += `<p class="empty">${S().nessuno}</p>`;

    // info
    const usedAll = new Set(menu.sezioni.flatMap(s => (s.voci || []).flatMap(v => v.allergeni || [])));
    html += `<section class="info"><h3>${S().info}</h3><div class="info__grid">
      ${menu.indirizzo ? `<div class="info__row">${ICON_UI.map}<span>${esc(menu.indirizzo)}${menu.maps ? `<br><a href="${esc(menu.maps)}" target="_blank" rel="noopener">${S().mappa} →</a>` : ''}</span></div>` : ''}
      ${menu.orari && t(menu.orari) ? `<div class="info__row">${ICON_UI.clock}<span>${esc(t(menu.orari))}</span></div>` : ''}
      ${tel ? `<div class="info__row">${ICON_UI.tel}<a href="tel:${esc(tel)}">${S().chiama} ${esc(menu.telefono)}</a></div>` : ''}
      ${ig ? `<div class="info__row">${ICON_UI.ig}<a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a></div>` : ''}
      ${menu.wifi ? `<div class="info__row">${ICON_UI.wifi}<span>Wi-Fi: ${esc(menu.wifi)}</span></div>` : ''}
    </div>
    ${menu.coperto ? `<p class="coperto">${S().coperto}: € ${esc(menu.coperto)}</p>` : ''}
    ${usedAll.size ? `<div class="legenda">${[...usedAll].sort((a, b) => a - b).map(k => R.allergeni[k] ? `<span><b>${k}</b>${esc(R.allergeni[k][lang] || R.allergeni[k].it)}</span>` : '').join('')}</div>` : ''}
    ${menu.note && t(menu.note) ? `<p class="coperto">${esc(t(menu.note))}</p>` : ''}
    </section>`;

    document.getElementById('app').innerHTML = html;
    const qEl = document.getElementById('q');
    qEl.addEventListener('input', () => { const pos = qEl.selectionStart; render(qEl.value); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
    observe();
    reveal();
  }

  // Comparsa morbida delle sezioni (solo al primo caricamento, non durante la ricerca).
  function reveal() {
    const items = [...document.querySelectorAll('.sezione.reveal:not(.in)')];
    if (revealed || !items.length) return;
    revealed = true;
    if (!('IntersectionObserver' in window)) { items.forEach((el) => el.classList.add('in')); return; }
    const ro = new IntersectionObserver((entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); ro.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    items.forEach((el) => ro.observe(el));
  }
  // Nome nella barra in alto e pulsante «torna su» dopo la copertina.
  const top = document.querySelector('.top'), su = document.getElementById('su');
  su.setAttribute('aria-label', S().su);
  su.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  const onScroll = () => { const y = window.scrollY; top.classList.toggle('scrolled', y > 180); su.classList.toggle('show', y > 700); };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  let io;
  function observe() {
    if (io) io.disconnect();
    const chips = [...document.querySelectorAll('.chip')];
    const secs = [...document.querySelectorAll('.sezione')];
    if (!secs.length) return;
    io = new IntersectionObserver(entries => {
      const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (!vis) return;
      const i = vis.target.id.replace('sez-', '');
      chips.forEach(c => c.setAttribute('aria-current', c.dataset.i === i));
      const active = chips.find(c => c.dataset.i === i);
      if (active) { const nav = active.parentElement; nav.scrollTo({ left: active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2, behavior: 'smooth' }); }
    }, { rootMargin: '-120px 0px -60% 0px' });
    secs.forEach(s => io.observe(s));
  }

  render();
})();
</script>
</body>
</html>
