name: scarica-foto
on:
  push:
    branches: [prove-lettura]
    paths: [prove-lettura/scaricare.txt]
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica le foto dei menu
        run: |
          set -u
          : > prove-lettura/scaricate.log
          while read -r dir url; do
            [ -z "${dir:-}" ] && continue
            case "$dir" in \#*) continue;; esac
            mkdir -p "prove-lettura/$dir"
            n=$(ls "prove-lettura/$dir" | grep -c '^foto-' || true)
            tmp=$(mktemp)
            code=$(curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -o "$tmp" -w '%{http_code}' --max-time 60 "$url" || echo 000)
            type=$(file -b --mime-type "$tmp")
            case "$type" in image/jpeg) ext=jpg;; image/png) ext=png;; image/webp) ext=webp;; *) ext="";; esac
            if [ "$code" = 200 ] && [ -n "$ext" ]; then
              out="prove-lettura/$dir/foto-$((n+1)).$ext"; mv "$tmp" "$out"
              echo "ok $dir $out $(stat -c%s "$out") $url" >> prove-lettura/scaricate.log
            else
              echo "ko $dir http=$code type=$type $url" >> prove-lettura/scaricate.log; rm -f "$tmp"
            fi
          done < prove-lettura/scaricare.txt
          : > prove-lettura/scaricare.txt
      - name: Salva nel ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A prove-lettura
          git commit -m "Foto dei menu di prova scaricate" || exit 0
          git push
